name: Publish npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'lilinxiong/openbaton'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      dist_tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Validate release tag
        id: release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          assert.equal(pkg.name, '@zhouliuya/openbaton');
          assert.equal(process.env.GITHUB_REF_TYPE, 'tag');
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`, 'Tag must match package.json version');
          assert.match(pkg.version, /^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${pkg.version.includes('-') ? 'next' : 'latest'}\n`);
          JS
          # Some integration tests need an attached checkout, just as in CI.
          git checkout -b npm-release-check

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Install locked dependencies and test
        run: |
          bun install --frozen-lockfile
          bun run test

      - name: Build and pack
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          # prepack runs the existing build; publish this exact tested artifact.
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          const { version } = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const dir = `${process.env.RUNNER_TEMP}/npm-package`;
          const archives = fs.readdirSync(dir).filter((file) => file.endsWith('.tgz'));
          assert.equal(archives.length, 1);
          const unpacked = `${process.env.RUNNER_TEMP}/npm-smoke`;
          fs.mkdirSync(unpacked);
          execFileSync('tar', ['-xzf', `${dir}/${archives[0]}`, '-C', unpacked]);
          assert.equal(execFileSync(process.execPath, [`${unpacked}/package/dist/bin/baton.js`, '--version'], { encoding: 'utf8' }).trim(), `baton ${version}`);
          JS

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package

      - name: Publish using npm trusted publishing
        env:
          DIST_TAG: ${{ needs.build.outputs.dist_tag }}
        run: |
          set -- "$RUNNER_TEMP"/npm-package/*.tgz
          test "$#" -eq 1 && test -f "$1"
          npm publish "$1" --ignore-scripts --provenance --access public --tag "$DIST_TAG" --registry=https://registry.npmjs.org
