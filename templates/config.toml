# baton director config
# Each CLI owns its picker-visible model catalog. Baton stores only labels and
# the exact models the user allows subagents to call.

[director]
# Desired Baton concurrency ceiling. Selecting Grok (`baton init --cli grok`
# or `baton config --cli grok`) writes Grok's host cap (8, or
# GROK_MAX_CONCURRENT_SUBAGENTS). AgentLimitReached tightens observed capacity
# and returns tickets to FIFO.
max_concurrent = 4
# Children cannot spawn children. This is a flat tree, not a count cap.
max_depth = 1

[cli]
active = "codex"

[cli.codex]
enabled = false
runner = ""
longctx = ""
subagent_models = []

[cli.grok]
enabled = false
runner = ""
longctx = ""
subagent_models = []

# Action classification remains global. Model labels live under the CLI above.
[ops.runner]
actions = ["test", "build", "lint", "typecheck", "git-commit"]

[ops.longctx]
actions = ["search", "digest", "git-summarize"]
