# baton director config
# Each CLI owns its picker-visible model catalog. Baton stores only labels and
# the exact models the user allows subagents to call.

[director]
# Desired Baton concurrency ceiling (generic file default). Runtime uses the
# resolved host's cap: Codex 4, Grok 8 (GROK_MAX_CONCURRENT_SUBAGENTS),
# Cursor 4 (CURSOR_MAX_CONCURRENT_SUBAGENTS), Claude Code 20
# (CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS). AgentLimitReached tightens observed
# capacity and returns tickets to FIFO.
max_concurrent = 4
# Children cannot spawn children. This is a flat tree, not a count cap.
max_depth = 1

[cli.codex]
enabled = false
runner = ""
longctx = ""
subagent_models = []

[cli.grok]
enabled = false
runner = ""
longctx = ""
subagent_models = []

[cli.cursor]
enabled = false
runner = ""
longctx = ""
subagent_models = []

[cli.claude]
enabled = false
runner = ""
longctx = ""
subagent_models = []

# Action classification remains global. Model labels live under the CLI above.
[ops.runner]
actions = ["test", "build", "lint", "typecheck", "git-commit"]

[ops.longctx]
actions = ["search", "digest", "git-summarize"]
