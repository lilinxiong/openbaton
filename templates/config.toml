# baton director config
# Each CLI owns its picker-visible model catalog and any scheduling limits it
# explicitly reports. Baton stores only selected profiles.

[director]
# Fallback limits. A selected [cli.<id>] may override either field only when
# that CLI's discovery response reports a real value.
max_concurrent = 4
max_depth = 1

# baton init/config writes only CLI profiles the user selected. Within a
# profile, max_concurrent/max_depth are omitted when the CLI did not report
# them, so the director values above remain effective.

# Execution classification is supplied by the director workflow contract.
# Operation labels are audit metadata and are never serialized as a routing
# table. Model labels live under selected CLI profiles.
