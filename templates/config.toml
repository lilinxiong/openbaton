# baton director config
# Each CLI owns its picker-visible model catalog. Baton stores only labels and
# the exact models the user allows subagents to call.

[director]
# Desired Baton concurrency ceiling. The host/session limit can be lower;
# AgentLimitReached tightens the observed capacity and returns tickets to FIFO.
max_concurrent = 4
# Children cannot spawn children. This is a flat tree, not a count cap.
max_depth = 1

[cli]
active = "codex"

[cli.codex]
enabled = false
runner = ""
longctx = ""
subagent_models = []

# Action classification remains global. Model labels live under the CLI above.
[ops.runner]
actions = ["test", "build", "lint", "typecheck"]

[ops.longctx]
actions = ["search", "digest", "git-summarize", "git-commit"]
