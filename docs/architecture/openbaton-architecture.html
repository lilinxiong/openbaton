html &gt; body {

    --background,
    light-dark(rgb(255 255 255), rgb(24 24 24))

    --foreground,

a:is(:hover, :focus-visible) {

h2,
h3,
h4,
h5,
h6,

}

b,

}

}

}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;openbaton-architecture&quot; class=&quot;baton-viz&quot;&gt;
  &lt;header class=&quot;baton-heading&quot;&gt;
    &lt;div&gt;
      &lt;h1&gt;OpenBaton 架构与运转逻辑&lt;/h1&gt;
      &lt;div class=&quot;text-muted&quot;&gt;基于当前 checkout · f5ee4d9&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;viz-controls&quot; aria-label=&quot;选择架构视图&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-view=&quot;overview&quot; aria-pressed=&quot;true&quot;&gt;整体架构&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-view=&quot;flow&quot; aria-pressed=&quot;false&quot;&gt;一次执行&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-view=&quot;lifecycle&quot; aria-pressed=&quot;false&quot;&gt;生命周期&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-view=&quot;capacity&quot; aria-pressed=&quot;false&quot;&gt;并发与安全&lt;/button&gt;
    &lt;/div&gt;
  &lt;/header&gt;

  &lt;div class=&quot;baton-panels&quot; aria-live=&quot;polite&quot;&gt;
    &lt;section data-panel=&quot;overview&quot;&gt;
      &lt;h2&gt;1. 整体架构：Baton 是调度与策略层，不是另一个执行器&lt;/h2&gt;
      &lt;div class=&quot;architecture-grid&quot; role=&quot;img&quot; aria-label=&quot;OpenBaton 整体架构：用户与 Director 规划工作，Baton Core 负责可审计调度，Adapter 连接 CLI 原生执行接口，Worker 在工作区内执行。&quot;&gt;
        &lt;div class=&quot;arch-column arch-director&quot;&gt;
          &lt;div class=&quot;arch-label&quot;&gt;对话与决策面&lt;/div&gt;
          &lt;div class=&quot;diagram-node series-1&quot;&gt;
            &lt;strong&gt;用户&lt;/strong&gt;
            &lt;span&gt;授权目标与变更范围&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flow-arrow vertical&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;diagram-node series-1&quot;&gt;
            &lt;strong&gt;Codex Director&lt;/strong&gt;
            &lt;span&gt;讨论 / 只读分析&lt;/span&gt;
            &lt;span&gt;分类、依赖、精确 write-set&lt;/span&gt;
            &lt;span&gt;父进程验证与 Git 所有权&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;flow-arrow horizontal&quot;&gt;→&lt;/div&gt;

        &lt;div class=&quot;arch-column arch-core&quot;&gt;
          &lt;div class=&quot;arch-label&quot;&gt;确定性的调度与策略面&lt;/div&gt;
          &lt;div class=&quot;diagram-node series-2 prominent&quot;&gt;
            &lt;strong&gt;Baton Core&lt;/strong&gt;
            &lt;span&gt;Activation / Host / Config&lt;/span&gt;
            &lt;span&gt;实时路由与模型校验&lt;/span&gt;
            &lt;span&gt;Ticket + 不可变 Receipt&lt;/span&gt;
            &lt;span&gt;Reserve / Bind / Probe / Finish / Release&lt;/span&gt;
            &lt;span&gt;Tree 容量 + Scope / Git 安全门&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;state-store&quot;&gt;
            &lt;strong&gt;~/.baton&lt;/strong&gt;
            &lt;span&gt;配置 · 目录快照 · Ticket · Receipt · 可用性事实&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;flow-arrow horizontal&quot;&gt;→&lt;/div&gt;

        &lt;div class=&quot;arch-column arch-runtime&quot;&gt;
          &lt;div class=&quot;arch-label&quot;&gt;宿主原生执行面&lt;/div&gt;
          &lt;div class=&quot;diagram-node series-3&quot;&gt;
            &lt;strong&gt;Adapter Package&lt;/strong&gt;
            &lt;span&gt;manifest + Public SDK&lt;/span&gt;
            &lt;span&gt;实时模型目录&lt;/span&gt;
            &lt;span&gt;原生 spawn 与 opaque handle&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flow-arrow vertical&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;diagram-node series-3&quot;&gt;
            &lt;strong&gt;CLI 原生子 Agent&lt;/strong&gt;
            &lt;span&gt;按精确 model / effort 执行&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;flow-arrow vertical&quot;&gt;↓&lt;/div&gt;
          &lt;div class=&quot;diagram-node series-4&quot;&gt;
            &lt;strong&gt;Worker&lt;/strong&gt;
            &lt;span&gt;只在 Receipt scope 内工作&lt;/span&gt;
            &lt;span&gt;不 stage / branch / rebase&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;boundary-band&quot;&gt;
        &lt;span&gt;&lt;strong&gt;控制事实：&lt;/strong&gt;Baton 管“谁、何时、以什么约束运行”&lt;/span&gt;
        &lt;span&gt;&lt;strong&gt;工作区事实：&lt;/strong&gt;滚动写入单元默认运行在 Baton 管理的隔离 worktree；显式 shared 模式才复用调用方 worktree，scope 所有权与审计在两种模式下都生效&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section data-panel=&quot;flow&quot; hidden&gt;
      &lt;h2&gt;2. 一次执行：从授权工作单元到释放并补位&lt;/h2&gt;
      &lt;div class=&quot;sequence&quot; role=&quot;img&quot; aria-label=&quot;一次 Baton 执行包含九步：Director 分类和拆分，Baton 选择模型，捕获基线，创建 Receipt 和 Ticket，计算安全前沿并保留槽位，Adapter 原生启动，绑定 handle，等待活动并完成审计，释放槽位并补充下一任务。&quot;&gt;
        &lt;div class=&quot;sequence-row sequence-row-four&quot;&gt;
          &lt;div class=&quot;sequence-step series-1&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;1&lt;/div&gt;
            &lt;strong&gt;Director 分类与拆分&lt;/strong&gt;
            &lt;span&gt;discussion / analysis 留在主会话&lt;/span&gt;
            &lt;span&gt;implementation / mechanical 才进入 Baton&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;step-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sequence-step series-1&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;2&lt;/div&gt;
            &lt;strong&gt;声明合同&lt;/strong&gt;
            &lt;span&gt;objective · deliverable · done_when&lt;/span&gt;
            &lt;span&gt;依赖 + 精确路径 + 操作集合&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;step-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sequence-step series-2&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;3&lt;/div&gt;
            &lt;strong&gt;路由校验&lt;/strong&gt;
            &lt;span&gt;enabled profile ∩ coding_models&lt;/span&gt;
            &lt;span&gt;实时 catalog ∩ reasoning / tier&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;step-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sequence-step series-2&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;4&lt;/div&gt;
            &lt;strong&gt;物化审计凭证&lt;/strong&gt;
            &lt;span&gt;写任务先捕获稳定 Git baseline&lt;/span&gt;
            &lt;span&gt;先写 Receipt，再写 queued Ticket&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
        &lt;div class=&quot;step-arrow step-break&quot;&gt;↓&lt;/div&gt;
        &lt;div class=&quot;sequence-row sequence-row-five&quot;&gt;
          &lt;div class=&quot;sequence-step series-5&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;5&lt;/div&gt;
            &lt;strong&gt;计算 maximal safe frontier&lt;/strong&gt;
            &lt;span&gt;依赖已就绪 ∩ scope 完整且不冲突&lt;/span&gt;
            &lt;span&gt;最多填满当前 tree 可用槽位&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;step-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sequence-step series-3&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;6&lt;/div&gt;
            &lt;strong&gt;Reserve → Native Spawn&lt;/strong&gt;
            &lt;span&gt;queued → dispatching；此时已占槽&lt;/span&gt;
            &lt;span&gt;Adapter 返回原生 opaque handle&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;step-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sequence-step series-3&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;7&lt;/div&gt;
            &lt;strong&gt;Bind → Run → Probe&lt;/strong&gt;
            &lt;span&gt;绑定 ticket / session / handle / host&lt;/span&gt;
            &lt;span&gt;活动信号与业务进度分开记录&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;step-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sequence-step series-4&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;8&lt;/div&gt;
            &lt;strong&gt;Finish + Parent Audit&lt;/strong&gt;
            &lt;span&gt;写任务核对路径、操作、HEAD、index、symlink&lt;/span&gt;
            &lt;span&gt;通过才接受结论；违规变 errored&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;step-arrow&quot;&gt;→&lt;/div&gt;
          &lt;div class=&quot;sequence-step series-5&quot;&gt;
            &lt;div class=&quot;step-number&quot;&gt;9&lt;/div&gt;
            &lt;strong&gt;Release + Refill&lt;/strong&gt;
            &lt;span&gt;terminal 仍占槽，直到 native release 确认&lt;/span&gt;
            &lt;span&gt;释放后重新计算下一批安全前沿&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;flow-formula&quot;&gt;
        &lt;strong&gt;关键闭环&lt;/strong&gt;
        &lt;span&gt;规划事实 → 不可变凭证 → 原生身份 → 活动证据 → 父进程审计 → 显式释放&lt;/span&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section data-panel=&quot;lifecycle&quot; hidden&gt;
      &lt;h2&gt;3. Ticket 与 Receipt：状态终结不等于槽位释放&lt;/h2&gt;
      &lt;div class=&quot;lifecycle-layout&quot;&gt;
        &lt;div class=&quot;state-rail&quot; role=&quot;img&quot; aria-label=&quot;Ticket 主生命周期从 queued 到 dispatching、running、terminal，最后 release。dispatching 遇到 agent limit 可回到 queued。running 只有最新精确 handle 被探测为 not found 才能 timeout。&quot;&gt;
          &lt;div class=&quot;state-node series-1&quot;&gt;&lt;strong&gt;queued&lt;/strong&gt;&lt;span&gt;已持久化，尚未占槽&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;state-edge&quot;&gt;&lt;span&gt;reserve&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;/div&gt;
          &lt;div class=&quot;state-node series-2&quot;&gt;&lt;strong&gt;dispatching&lt;/strong&gt;&lt;span&gt;reservation 已建立，开始占槽&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;state-edge&quot;&gt;&lt;span&gt;bind(handle)&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;/div&gt;
          &lt;div class=&quot;state-node series-3&quot;&gt;&lt;strong&gt;running&lt;/strong&gt;&lt;span&gt;原生 handle 已绑定；probe / progress&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;state-edge&quot;&gt;&lt;span&gt;finish + audit&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;/div&gt;
          &lt;div class=&quot;terminal-group&quot;&gt;
            &lt;div class=&quot;state-node series-4&quot;&gt;&lt;strong&gt;completed&lt;/strong&gt;&lt;span&gt;成功且安全门通过&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;state-node danger&quot;&gt;&lt;strong&gt;errored&lt;/strong&gt;&lt;span&gt;执行失败或安全门拒绝&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;state-node series-5&quot;&gt;&lt;strong&gt;timed_out / closed&lt;/strong&gt;&lt;span&gt;基于原生状态，不靠固定等待猜测&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;state-edge release-edge&quot;&gt;&lt;span&gt;native release 确认&lt;/span&gt;&lt;b&gt;→&lt;/b&gt;&lt;/div&gt;
          &lt;div class=&quot;state-node released&quot;&gt;&lt;strong&gt;slot_released_at&lt;/strong&gt;&lt;span&gt;槽位现在才真正归还&lt;/span&gt;&lt;/div&gt;
        &lt;/div&gt;

        &lt;div class=&quot;side-rules&quot;&gt;
          &lt;div class=&quot;rule-block series-2&quot;&gt;
            &lt;strong&gt;背压回路&lt;/strong&gt;
            &lt;span&gt;dispatching + AGENT_LIMIT_REACHED&lt;/span&gt;
            &lt;span&gt;→ 同一个 ticket / session / model 回到 queued&lt;/span&gt;
            &lt;span&gt;→ attempt 不消耗，不影响其他 root tree&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;rule-block series-5&quot;&gt;
            &lt;strong&gt;不可变 Receipt&lt;/strong&gt;
            &lt;span&gt;route + effort + mode + scope + Git policy + baseline&lt;/span&gt;
            &lt;span&gt;Receipt 先于 worker-ready Ticket 持久化，文件权限 0600&lt;/span&gt;
          &lt;/div&gt;
          &lt;div class=&quot;rule-block series-4&quot;&gt;
            &lt;strong&gt;配额 successor&lt;/strong&gt;
            &lt;span&gt;确认 route quota 耗尽后记录全局可用性事实&lt;/span&gt;
            &lt;span&gt;仅在未修改 / baseline 可核对时创建新 ordinal + 新 Receipt&lt;/span&gt;
            &lt;span&gt;原 ticket 不改写；否则进入 reconciliation&lt;/span&gt;
          &lt;/div&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/section&gt;

    &lt;section data-panel=&quot;capacity&quot; hidden&gt;
      &lt;h2&gt;4. 并发与安全：容量按 tree 隔离，写入所有权按 workspace 统一&lt;/h2&gt;
      &lt;div class=&quot;capacity-formula&quot; role=&quot;img&quot; aria-label=&quot;有效容量等于 host limit、configured policy 和当前 operation limit 中已知值的最小值。&quot;&gt;
        &lt;span&gt;effective capacity&lt;/span&gt;
        &lt;b&gt;= min(&lt;/b&gt;
        &lt;span class=&quot;formula-chip series-1&quot;&gt;host_limit&lt;/span&gt;
        &lt;span class=&quot;formula-chip series-2&quot;&gt;configured_policy&lt;/span&gt;

  (() =&gt; {
    const root = document.getElementById(&#x27;openbaton-architecture&#x27;);
    if (!root) return;
    const buttons = [...root.querySelectorAll(&#x27;[data-view]&#x27;)];
    const panels = [...root.querySelectorAll(&#x27;[data-panel]&#x27;)];
    const selectView = (name) =&gt; {
      buttons.forEach((button) =&gt; {
        const active = button.dataset.view === name;
        button.setAttribute(&#x27;aria-pressed&#x27;, String(active));
        button.classList.toggle(&#x27;btn-primary&#x27;, active);
      });
      panels.forEach((panel) =&gt; { panel.hidden = panel.dataset.panel !== name; });
    };
    buttons.forEach((button) =&gt; button.addEventListener(&#x27;click&#x27;, () =&gt; selectView(button.dataset.view)));
  })();

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }
    }, 0);
  };
  const handleLeave = (event) =&gt; {
    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
